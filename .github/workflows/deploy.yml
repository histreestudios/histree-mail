name: Deploy Mailflow
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Create database (first run only) and apply schema
        run: |
          npx wrangler d1 create mailflow || true
          ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).find(x=>x.name==='mailflow').uuid))")
          sed -i "s/PASTE_ID_FROM_wrangler_d1_create/$ID/" wrangler.toml
          npx wrangler d1 execute mailflow --remote --file=schema.sql
      - name: Deploy
        run: npx wrangler deploy 2>&1 | tee deploy.log
      - name: Save dashboard password and keys
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ENC_KEY: ${{ secrets.ENC_KEY }}
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          node -e "const {ADMIN_PASSWORD,SESSION_SECRET,ENC_KEY,RUNNER_TOKEN}=process.env;console.log(JSON.stringify({ADMIN_PASSWORD,SESSION_SECRET,ENC_KEY,RUNNER_TOKEN}))" > /tmp/s.json
          npx wrangler secret bulk /tmp/s.json
          rm /tmp/s.json
      - name: Show your dashboard address
        run: |
          URL=$(grep -o 'https://[^ ]*workers.dev' deploy.log | head -1)
          echo "### Your Mailflow dashboard: $URL" >> "$GITHUB_STEP_SUMMARY"
